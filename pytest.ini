[pytest]
# Feature files live here; scenarios("x.feature") resolves relative to this dir
bdd_features_base_dir = features
testpaths = tests
# Gherkin @tags become pytest markers — register them so -m filtering is clean
markers =
    api: scenarios that exercise the API/backend layer
    ui: scenarios that drive the admin console with Playwright
    access_control: access-control product area
    billing: billing product area
    provisioning: credential provisioning
    revoking: credential revocation
    lifecycle: full end-to-end journeys
    security: highest-risk security assertions
    isolation: one record must not affect another
    negative: invalid-input / error-handling paths
    submeter: submeter billing
    hvac: after-hours HVAC billing
    multiplier: meter multiplier correctness
    minimum_hours: minimum-hours billing rule
    rounding: money rounded to the cent
