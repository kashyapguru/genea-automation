name: Genea QA Pipeline (BDD)

# Runs the Gherkin feature suites on every push and PR with STAGED quality
# gates. Suites are selected by Gherkin @tag (pytest marker), so adding a new
# scenario to a .feature file automatically lands in the right gate.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # allow manual runs

jobs:
  # ------------------------------------------------------------------
  # GATE 1 — API scenarios (fast, run first; the bulk of coverage)
  # ------------------------------------------------------------------
  api-scenarios:
    name: API Scenarios (Access Control + Billing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run access-control API feature
        run: pytest -m "api and access_control" -v

      - name: Run billing accuracy feature
        run: pytest -m "api and billing" -v

      - name: Security-critical scenarios must pass
        run: pytest -m "security" -v

  # ------------------------------------------------------------------
  # GATE 2 — UI scenarios (slower; run only after API gate passes)
  # ------------------------------------------------------------------
  ui-scenarios:
    name: UI Scenarios (Playwright)
    runs-on: ubuntu-latest
    needs: api-scenarios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run access-control UI feature
        run: pytest -m "ui" -v

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ------------------------------------------------------------------
  # FINAL GATE — every feature together (release-readiness signal)
  # ------------------------------------------------------------------
  full-suite:
    name: Full Suite (release gate)
    runs-on: ubuntu-latest
    needs: [ api-scenarios, ui-scenarios ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run all features
        run: |
          mkdir -p reports
          pytest -v --cucumberjson=reports/cucumber.json

      - name: Upload living-documentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          retention-days: 14

      - name: Quality gate summary
        if: success()
        run: echo "All quality gates passed - change is safe to merge/release."
